<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Barber Connection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="auth-icon">✂️</span>
                <h1>Crear tu cuenta</h1>
                <p>Regístrate para empezar a gestionar tu barbería</p>
            </div>

            <form id="signupForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input id="name" name="name" type="text" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo</label>
                    <input id="email" name="email" type="email" placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-button">Crear cuenta</button>
                <p class="form-hint">Demo: usa cualquier correo y contraseña de 6+ caracteres</p>
                <p id="formMessage" class="form-message" aria-live="polite"></p>
            </form>

            <p class="auth-footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </section>
    </main>

    <script src="logic.js"></script>
</body>
</html>
