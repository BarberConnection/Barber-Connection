<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barber Connection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="auth-icon">✂️</span>
                <h1>Barber Connection</h1>
                <p>Accede a tu panel de gestión</p>
            </div>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input id="email" name="email" type="email" placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-button">Entrar</button>
                <p class="form-hint">Demo: admin@barber.com / 123456</p>
                <p id="formMessage" class="form-message" aria-live="polite"></p>
            </form>

            <p class="auth-footer">¿No tienes cuenta? <a href="signup.html">Crear cuenta</a></p>
        </section>
    </main>

    <script src="logic.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const message = document.getElementById('formMessage');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const email = form.email.value;
            const password = form.password.value;
            const result = window.BarberAuth.loginUser(email, password);

            message.textContent = result.message;
            message.className = result.ok ? 'form-message success' : 'form-message error';

            if (result.ok) {
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 700);
            }
        });
    </script>
</body>
</html>
